# IMAGE is replaced by the deploy workflow (or by you, with sed) before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-flask
  template:
    metadata:
      labels:
        app: hello-flask
    spec:
      containers:
        - name: web
          image: IMAGE
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: hello-flask
spec:
  type: LoadBalancer   # AWS creates a public load balancer for this
  selector:
    app: hello-flask
  ports:
    - port: 80
      targetPort: 5000
