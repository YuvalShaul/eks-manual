# Build the Flask image and push it to Docker Hub. Run by hand: Actions > build-push > Run workflow.
#
# Needs (Settings > Secrets and variables > Actions):
#   variable DOCKERHUB_USERNAME  - your Docker Hub user (not secret)
#   secret   DOCKERHUB_TOKEN     - a Docker Hub access token (secret!)
name: build-push

on:
  workflow_dispatch: # the "Run workflow" button

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/hello-flask
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub (using the secret)
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        run: docker build --build-arg VERSION="${GITHUB_SHA::7}" -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" app

      - name: Push
        run: |
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          echo "Pushed https://hub.docker.com/r/$IMAGE/tags" >> "$GITHUB_STEP_SUMMARY"
