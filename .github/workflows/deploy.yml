# Run the image on EKS. Run by hand: Actions > deploy > Run workflow.
#
# Needs (Settings > Secrets and variables > Actions):
#   secret   AWS_ACCESS_KEY_ID      - access key of the IAM user "github-ci" (created by hand)
#   secret   AWS_SECRET_ACCESS_KEY  - its secret access key
#   variable DOCKERHUB_USERNAME     - same as build-push
#   variable AWS_REGION             - optional, default us-west-2
#   variable EKS_CLUSTER            - optional, default learn-eks
name: deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy"
        default: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      EKS_CLUSTER: ${{ vars.EKS_CLUSTER || 'learn-eks' }}
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/hello-flask:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Who does AWS think we are?
        run: aws sts get-caller-identity

      - name: Get a kubeconfig for the cluster
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Who does Kubernetes think we are, and what may we do?
        run: |
          kubectl auth whoami
          echo "create deployments in default: $(kubectl auth can-i create deployments -n default)"
          echo "create deployments in kube-system: $(kubectl auth can-i create deployments -n kube-system || true)"
          echo "list nodes: $(kubectl auth can-i list nodes || true)"

      - name: Deploy
        run: |
          echo "Deploying $IMAGE"
          sed "s|IMAGE|$IMAGE|" k8s/app.yaml | kubectl apply -f -
          kubectl rollout restart deployment/hello-flask   # pull "latest" again
          kubectl rollout status deployment/hello-flask --timeout=180s

      - name: Where is it?
        run: |
          kubectl get pods -l app=hello-flask -o wide
          HOST=$(kubectl get svc hello-flask -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "App URL: http://$HOST  (DNS may take a minute or two the first time)" | tee -a "$GITHUB_STEP_SUMMARY"
